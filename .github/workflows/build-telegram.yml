name: Build Telegram (TestFlight)

# Запускается только вручную: Actions -> Build Telegram (TestFlight) -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Номер сборки (целое число). Пусто = номер запуска + 1000. Для каждой загрузки в TestFlight должен быть новым."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: telegram-build
  cancel-in-progress: false

env:
  BAZEL_DISK_CACHE: ~/telegram-bazel-cache

jobs:
  build:
    # xcode-27 нужен потому, что versions.json требует Xcode 27.1, он есть в этом образе (только arm64).
    # Если не хватит памяти или диска, задайте в Settings -> Variables переменную
    # RUNNER_LABEL = xcode-27-xlarge (платный, более мощный runner).
    runs-on: ${{ vars.RUNNER_LABEL || 'xcode-27' }}
    timeout-minutes: 360
    env:
      HAS_ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE != '' }}

    steps:
      - name: Checkout (с сабмодулями)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Выбрать Xcode из versions.json
        run: |
          XCODE_VERSION=$(python3 -c "import json; print(json.load(open('versions.json'))['xcode'])")
          echo "Нужен Xcode $XCODE_VERSION"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          if ! xcrun metal --version >/dev/null 2>&1; then
            XCODE_BUILD=$(xcodebuild -version | awk '/Build version/ {print $3}')
            EXPORT_DIR="$RUNNER_TEMP/metal-toolchain"
            rm -rf "$EXPORT_DIR"
            for attempt in 1 2 3; do
              xcodebuild -downloadComponent MetalToolchain -exportPath "$EXPORT_DIR" 2>&1 | tee "$RUNNER_TEMP/metal-download.log" && break
              sleep 10
            done
            BUNDLE=$(ls -d "$EXPORT_DIR"/*.exportedBundle 2>/dev/null | head -1)
            TOOLCHAIN_BUILD=$(sed -n 's/.*Metal Toolchain \([0-9A-Za-z]*\).*/\1/p' "$RUNNER_TEMP/metal-download.log" | tail -1)
            echo "Xcode $XCODE_BUILD, Metal Toolchain $TOOLCHAIN_BUILD, bundle $BUNDLE"
            if [ -n "$BUNDLE" ]; then
              if [ -n "$TOOLCHAIN_BUILD" ] && [ "$TOOLCHAIN_BUILD" != "$XCODE_BUILD" ]; then
                find "$BUNDLE" -maxdepth 1 -name '*.plist' -exec sed -i '' -e "s/$TOOLCHAIN_BUILD/$XCODE_BUILD/g" {} +
              fi
              sudo xcodebuild -importComponent MetalToolchain -importPath "$BUNDLE" || true
            fi
          fi
          if ! xcrun metal --version >/dev/null 2>&1; then
            echo "Metal Toolchain для Xcode $XCODE_VERSION не подключился, собираю на Xcode 27.0"
            sudo xcode-select -s /Applications/Xcode_27.app
            xcodebuild -version
            if ! xcrun metal --version >/dev/null 2>&1; then
              sudo xcodebuild -downloadComponent MetalToolchain
            fi
            echo "XCODE_OVERRIDE_FLAG=--overrideXcodeVersion" >> "$GITHUB_ENV"
          fi
          xcrun metal --version
          df -h /

      - name: Собрать configuration.json
        env:
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
          TEAM_ID: ${{ vars.TEAM_ID }}
          APPSTORE_ID: ${{ vars.APPSTORE_ID }}
          API_ID: ${{ secrets.TG_API_ID }}
          API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'PY'
          import json, os
          # Берём шаблон из репозитория и меняем только нужные поля,
          # чтобы типы остальных значений остались как в оригинале.
          cfg = json.load(open("build-system/template_minimal_development_configuration.json"))
          cfg["bundle_id"] = os.environ["BUNDLE_ID"]
          cfg["team_id"] = os.environ["TEAM_ID"]
          cfg["api_id"] = os.environ["API_ID"]
          cfg["api_hash"] = os.environ["API_HASH"]
          # Сборка для App Store / TestFlight. Make.py записывает эти значения в строки
          # через format(), поэтому здесь именно строки в нижнем регистре, как в шаблоне.
          cfg["is_internal_build"] = "false"
          cfg["is_appstore_build"] = "true"
          cfg["appstore_id"] = os.environ.get("APPSTORE_ID") or "0"
          for key in ("bundle_id", "team_id", "api_id", "api_hash"):
              if not cfg[key]:
                  raise SystemExit("Пустое значение: " + key)
          with open(os.path.join(os.environ["RUNNER_TEMP"], "configuration.json"), "w") as f:
              json.dump(cfg, f, indent=2)
          print("configuration.json готов, bundle_id =", cfg["bundle_id"])
          PY

      - name: Импортировать сертификат подписи в временную связку ключей
        env:
          P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Добавляем нашу связку в список поиска, сохраняя существующие.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/dist.p12"

      - name: Разложить профили App Store (7 штук)
        env:
          P_TELEGRAM: ${{ secrets.PROFILE_TELEGRAM }}
          P_SHARE: ${{ secrets.PROFILE_SHARE }}
          P_NOTIFICATION_SERVICE: ${{ secrets.PROFILE_NOTIFICATION_SERVICE }}
          P_NOTIFICATION_CONTENT: ${{ secrets.PROFILE_NOTIFICATION_CONTENT }}
          P_WIDGET: ${{ secrets.PROFILE_WIDGET }}
          P_SIRI_INTENTS: ${{ secrets.PROFILE_SIRI_INTENTS }}
          P_BROADCAST_UPLOAD: ${{ secrets.PROFILE_BROADCAST_UPLOAD }}
        run: |
          DIR="$RUNNER_TEMP/codesigning"
          mkdir -p "$DIR/profiles" "$DIR/certs"
          put() { printf '%s' "$2" | base64 --decode > "$DIR/profiles/$1.mobileprovision"; }
          put Telegram "$P_TELEGRAM"
          put Share "$P_SHARE"
          put NotificationService "$P_NOTIFICATION_SERVICE"
          put NotificationContent "$P_NOTIFICATION_CONTENT"
          put Widget "$P_WIDGET"
          put Intents "$P_SIRI_INTENTS"
          put BroadcastUpload "$P_BROADCAST_UPLOAD"
          # Имена файлов не важны: Make.py сопоставляет профили по application-identifier внутри.
          ls -l "$DIR/profiles"

      - name: Восстановить кэш Bazel
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          # Ключ уникален для каждого запуска, а restore-keys подтягивает самый свежий предыдущий кэш.
          key: bazel-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ runner.arch }}-

      - name: Определить номер сборки
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          BN="${INPUT_BUILD_NUMBER:-$((GITHUB_RUN_NUMBER + 1000))}"
          echo "BUILD_NUMBER=$BN" >> "$GITHUB_ENV"
          echo "Номер сборки: $BN"

      - name: Сборка (release_arm64)
        # Таймаут шага меньше таймаута job, чтобы шаг сохранения кэша успел выполниться,
        # даже если первая (холодная) сборка не уложится во время.
        timeout-minutes: 320
        run: |
          mkdir -p "$HOME/telegram-bazel-cache" "$RUNNER_TEMP/artifacts"
          python3 build-system/Make/Make.py $XCODE_OVERRIDE_FLAG \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath="$RUNNER_TEMP/configuration.json" \
            --codesigningInformationPath="$RUNNER_TEMP/codesigning" \
            --buildNumber="$BUILD_NUMBER" \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="$RUNNER_TEMP/artifacts"

      - name: Сохранить кэш Bazel (даже если сборка упала или превысила время)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: bazel-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

      - name: Диагностика диска
        if: always()
        run: df -h / && du -sh "$HOME/telegram-bazel-cache" 2>/dev/null || true

      - name: Загрузить в TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios \
            --file "$RUNNER_TEMP/artifacts/Telegram.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          rm -f "$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"

      # Запасной вариант: если загрузка из CI не сработала, зашифрованный IPA можно скачать
      # и загрузить в App Store Connect вручную (Transporter). Без ARTIFACT_PASSPHRASE
      # артефакт не публикуется, чтобы не раскрыть api_hash в публичном репозитории.
      - name: Зашифровать IPA
        if: always() && env.HAS_ARTIFACT_PASSPHRASE == 'true'
        env:
          ARTIFACT_PASSPHRASE: ${{ secrets.ARTIFACT_PASSPHRASE }}
        run: |
          IPA="$RUNNER_TEMP/artifacts/Telegram.ipa"
          if [ -f "$IPA" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:ARTIFACT_PASSPHRASE -in "$IPA" -out "$IPA.enc"
            rm "$IPA"
          fi

      - name: Загрузить зашифрованный IPA как артефакт
        if: always() && env.HAS_ARTIFACT_PASSPHRASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-build
          path: ${{ runner.temp }}/artifacts/Telegram.ipa.enc
          if-no-files-found: ignore
          retention-days: 7
